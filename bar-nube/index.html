<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0807">
  <meta name="apple-mobile-web-app-title" content="Cuentas Gato">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cuentas Callejón del Gato</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <nav class="nav" id="nav" hidden>
    <a href="#/" data-nav="mesas">Mesas</a>
    <a href="#/inventario" data-nav="inventario">Inventario</a>
    <a href="#/ventas" data-nav="ventas" class="solo-admin" hidden>Ventas</a>
    <a href="#/catalogo" data-nav="catalogo" class="nav-admin solo-admin" title="Catálogo: productos, precios, mesas" hidden>⚙</a>
    <button type="button" id="salir" class="nav-salir" title="Cerrar sesión"><span id="quien"></span> ⏻</button>
  </nav>
  <div id="aviso-red" class="aviso error" hidden>Sin conexión con el servidor. Reintentando…</div>
  <div id="avisos"></div>
  <main id="app"><p class="vacio">Cargando…</p></main>

  <dialog id="dlg-mover">
    <form id="form-mover">
      <h2 id="mover-titulo"></h2>
      <label class="opcion"><input type="radio" name="tipo" value="compra" checked> Entró mercancía</label>
      <label class="opcion"><input type="radio" name="tipo" value="conteo"> Conteo</label>
      <label><span id="mover-unidad">Cantidad</span> <input type="number" name="cantidad" inputmode="numeric" min="0" required></label>
      <label class="solo-compra">Costo por unidad (opcional) <input type="number" name="costo" inputmode="numeric" min="0"></label>
      <label>Nota (opcional) <input type="text" name="nota" maxlength="200"></label>
      <div class="acciones">
        <button type="button" class="btn" data-cerrar>Cancelar</button>
        <button class="btn principal">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-form"><form id="form-generico"></form></dialog>

  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
