[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "centinela-core"
version = "0.2.0"
description = "Conteo de plantas en una imagen aérea — Proyecto Centinela, Etapa I"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.23",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]
demo = ["streamlit>=1.38"]  # demo/app.py — demo en vivo
modelo = ["deepforest>=2"]  # scripts/comparar_deepforest.py — ~1 GB con PyTorch, solo local

[project.scripts]
centinela = "centinela_core.cli:main"

[tool.setuptools]
packages = ["centinela_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["DTZ005"]  # timestamp local naive en el manifest, a propósito
