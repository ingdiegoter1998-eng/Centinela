<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Centinela{% endblock %} · Registro de campo</title>
<style>
  :root {
    --paper: #f7f5f0; --paper-2: #eeebe2; --line: #ddd8cb;
    --tx: #17241c; --tx-soft: #55665c; --ink: #0c1610;
    --green: #2f7d46; --amber: #bd7a1c; --red: #b3412f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--tx);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: var(--green); }
  a:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  header.barra { background: var(--ink); color: #eef2ec; }
  header.barra .wrap { display: flex; align-items: center; gap: 20px; height: 56px; }
  header.barra a { color: #a2b4a6; text-decoration: none; font-size: 14px; }
  header.barra a:hover { color: #eef2ec; }
  header.barra .marca { color: #59b072; font-weight: 600; font-size: 16px; margin-right: auto; }
  .wrap { max-width: 1100px; margin: 0 auto; padding-inline: 20px; }
  main { padding-block: 32px 64px; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.01em; }
  h2 { font-size: 20px; margin: 32px 0 10px; }
  .sub { color: var(--tx-soft); margin: 0 0 24px; }
  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .cifra { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
  .cifra b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .cifra span { font-size: 13px; color: var(--tx-soft); }
  .tabla { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--tx-soft); background: var(--paper-2); }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .chip.consistente { background: rgba(47,125,70,.12); color: var(--green); }
  .chip.rango { background: rgba(179,65,47,.12); color: var(--red); }
  .chip.vacio, .chip.nada { background: var(--paper-2); color: var(--tx-soft); }
  .vacio-msg { background: #fff; border: 1px dashed var(--line); border-radius: 6px; padding: 24px; color: var(--tx-soft); }
  .foto img { max-width: 220px; border-radius: 4px; display: block; }
  .nota { font-size: 14px; color: var(--tx-soft); }
</style>
</head>
<body>
<header class="barra">
  <div class="wrap">
    <a class="marca" href="{% url 'tablero' %}">Centinela · registro de campo</a>
    <a href="{% url 'tablero' %}">Tablero</a>
    <a href="{% url 'admin:index' %}">Administrar datos</a>
    <a href="https://centinela-demo.streamlit.app/" target="_blank" rel="noreferrer">Demo</a>
  </div>
</header>
<main class="wrap">
{% block contenido %}{% endblock %}
</main>
</body>
</html>
