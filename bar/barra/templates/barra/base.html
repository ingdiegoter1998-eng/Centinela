{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14141c">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{% block titulo %}Bar{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🍺%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{% static 'barra/app.css' %}">
</head>
<body>
  <nav class="nav">
    {% with actual=request.resolver_match.url_name %}
    <a href="{% url 'mesas' %}" {% if actual == 'mesas' or actual == 'cuenta' %}class="activo"{% endif %}>Mesas</a>
    <a href="{% url 'inventario' %}" {% if actual == 'inventario' %}class="activo"{% endif %}>Inventario</a>
    <a href="{% url 'ventas' %}" {% if actual == 'ventas' or actual == 'factura' %}class="activo"{% endif %}>Ventas</a>
    {% endwith %}
    <a href="{% url 'admin:index' %}" class="nav-admin" title="Administración (catálogo, mesas, clientes)">⚙</a>
  </nav>
  {% for m in messages %}<div class="aviso {{ m.tags }}">{{ m }}</div>{% endfor %}
  <main>{% block contenido %}{% endblock %}</main>
  <script src="{% static 'barra/app.js' %}" defer></script>
</body>
</html>
