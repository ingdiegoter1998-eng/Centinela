# Publica en GitHub Pages en cada push a main: la landing (landing/) en la raíz y el control
# del bar (bar-nube/, solo el front estático) en /bar/.
# Requiere activar Pages en Settings → Pages → Source: GitHub Actions.
name: Desplegar sitio

on:
  push:
    branches: [main]
    paths: ['landing/**', 'bar-nube/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Agregar el control del bar en /bar/
        working-directory: .
        run: |
          mkdir -p landing/dist/bar
          cp -r bar-nube/index.html bar-nube/app.css bar-nube/app.js bar-nube/config.js bar-nube/vendor landing/dist/bar/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
